<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--ink:#14161c;--graphite:#5b606e;--mist:#9a9ea9;--paper:#f4f3ee;--card:#ffffff;--line:#e3e2db;--line2:#d3d2ca;--accent:#2f4ee6;--accent-tint:#e8ebfc;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);}
  ::selection{background:var(--accent);color:#fff;}
  a{color:var(--accent);text-decoration:none;}
  a:hover{text-decoration:underline;}
  @media (max-width:820px){
    .wrap{padding-left:24px !important; padding-right:24px !important;}
    .nav-links{gap:14px !important; font-size:13px !important; flex-wrap:wrap; justify-content:flex-end;}
    .g1{grid-template-columns:1fr !important;}
    .page-h{font-size:42px !important;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>
</helmet>
<div style="--accent: {{ accent }}; font-family:'IBM Plex Sans',sans-serif; color:var(--ink); background:var(--paper); min-height:100vh; display:flex; flex-direction:column;">

  <div style="position:sticky; top:0; z-index:10; background:rgba(244,243,238,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);">
    <div class="wrap" style="max-width:1160px; margin:0 auto; padding:18px 48px; display:flex; justify-content:space-between; align-items:center;">
      <a href="index.html" style="display:flex; align-items:flex-start; font-family:'Onest',sans-serif; font-weight:600; font-size:22px; line-height:.9; color:var(--ink); text-decoration:none;">id<span style="color:var(--accent); font-size:8px; margin-left:2px; margin-top:2px;">●</span><span style="font-weight:400; color:var(--graphite); margin-left:7px;">consulting</span></a>
      <div class="nav-links" style="display:flex; gap:28px; align-items:center; font-size:14px;">
        <a href="index.html#services" style="color:var(--graphite);">Услуги</a>
        <a href="cases.html" style="color:var(--ink); font-weight:500;">Кейсы</a>
        <a href="insights.html" style="color:var(--graphite);">Аналитика</a>
        <a href="index.html#contact" style="color:var(--graphite);">Контакты</a>
      </div>
    </div>
  </div>

  <section data-screen-label="Кейсы — хедер" class="wrap" style="max-width:1160px; margin:0 auto; padding:72px 48px 0; width:100%;">
    <div style="font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.18em; color:var(--mist);">SELECTED WORK</div>
    <div class="page-h" style="font-family:'Onest',sans-serif; font-weight:600; font-size:64px; letter-spacing:-.02em; line-height:1.06; margin-top:22px;">Кейсы<span style="color:var(--accent);">.</span></div>
    <div style="font-size:17px; color:var(--graphite); line-height:1.65; margin-top:18px; max-width:560px;">Имена клиентов не называем — конфиденциальность входит в услугу. Масштаб и суть задач говорят сами.</div>
    <div style="display:flex; gap:10px; margin-top:40px; flex-wrap:wrap;">
      <sc-for list="{{ filters }}" as="flt" hint-placeholder-count="5">
        <button onClick="{{ flt.pick }}" style="font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.06em; padding:10px 18px; border-radius:100px; border:1px solid {{ flt.border }}; background:{{ flt.bg }}; color:{{ flt.color }}; cursor:pointer; transition:all .2s;">{{ flt.label }}</button>
      </sc-for>
    </div>
  </section>

  <section data-screen-label="Кейсы — список" class="wrap" style="max-width:1160px; margin:0 auto; padding:44px 48px 96px; width:100%; flex:1;">
    <div class="g1" style="display:grid; grid-template-columns:1fr 1fr; gap:24px;">
      <sc-for list="{{ cases }}" as="c" hint-placeholder-count="4">
        <div style="background:var(--card); border:1px solid var(--line); border-radius:14px; padding:40px; display:flex; flex-direction:column; gap:18px; transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;" style-hover="transform:translateY(-4px); box-shadow:0 18px 36px -22px rgba(20,22,28,.3); border-color:var(--accent);">
          <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.18em; color:var(--accent);">{{ c.kicker }}</div>
          <div style="font-family:'Onest',sans-serif; font-weight:600; font-size:23px; line-height:1.25;">{{ c.title }}</div>
          <div style="font-size:15px; color:var(--graphite); line-height:1.65;">{{ c.text }}</div>
          <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:auto;">
            <sc-for list="{{ c.tags }}" as="t" hint-placeholder-count="2">
              <span style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--graphite); border:1px solid var(--line2); border-radius:6px; padding:5px 10px;">{{ t }}</span>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <section data-screen-label="Футер" style="background:var(--ink); color:#fff;">
    <div class="wrap" style="max-width:1160px; margin:0 auto; padding:26px 48px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
      <div style="display:flex; align-items:flex-start; font-family:'Onest',sans-serif; font-weight:600; font-size:17px; line-height:.9; color:#fff;">id<span style="color:var(--accent); font-size:6px; margin-left:2px; margin-top:2px;">●</span></div>
      <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:rgba(255,255,255,.35);">© 2026 id consulting · ООО «АйДи Консалтинг»</div>
    </div>
  </section>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;accentColor&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#2f4ee6&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#2f4ee6&quot;, &quot;#5b3ee6&quot;, &quot;#0f5f4a&quot;, &quot;#14161c&quot;], &quot;section&quot;: &quot;Brand&quot; }
}">
class Component extends DCLogic {
  state = { filter: 'Все' };
  static FILTERS = ['Все', 'Банкротство', 'Активы', 'Сопровождение', 'Корпоративное'];
  static CASES = [
    { kicker: 'КРУПНЫЙ БИЗНЕС · ПРОЕКТНАЯ РАБОТА', title: 'Федеральный девелопер: банкротная практика под ключ', text: 'Привлечённые специалисты по банкротству для одного из крупных федеральных девелоперов: взыскание задолженности, банкротство должников, приобретение активов в процедурах, сопровождение споров.', tags: ['Взыскание', 'Банкротство', 'Приобретение активов'], cats: ['Банкротство', 'Активы'] },
    { kicker: 'СРЕДНИЙ БИЗНЕС · СОПРОВОЖДЕНИЕ', title: 'Операционный бизнес: юридический отдел на абонементе', text: 'Сопровождение сетевых медицинских клиник, ресторанов и магазинов: договоры, аренда, персонал, проверки. В медицине — отраслевая экспертиза: лицензирование, требования регуляторов, споры с пациентами.', tags: ['Медицина', 'Рестораны', 'Ритейл'], cats: ['Сопровождение'] },
    { kicker: 'ЗАЩИТА АКТИВОВ · СПОРЫ', title: 'Корпоративный спор вокруг торгового объекта в Сочи', text: 'Сопровождение корпоративного конфликта вокруг крупного торгового объекта: защита прав собственника, работа с корпоративной структурой, судебная стратегия.', tags: ['Недвижимость', 'Корпоративный конфликт'], cats: ['Активы', 'Корпоративное'] },
    { kicker: 'ЗАЩИТА АКТИВОВ · СТРАТЕГИЯ', title: 'Защита актива, приобретённого в банкротстве 2000-х', text: 'Разработка стратегии защиты крупного актива, приобретённого в процедуре банкротства в начале 2000-х, от притязаний государства: анализ истории приобретения, правовая позиция собственника, план действий.', tags: ['Защита активов', 'Споры с государством'], cats: ['Активы', 'Банкротство'] },
  ];
  renderVals() {
    const f = this.state.filter;
    return {
      accent: this.props.accentColor ?? '#2f4ee6',
      filters: Component.FILTERS.map(label => ({
        label,
        border: f === label ? 'var(--accent)' : 'var(--line2)',
        bg: f === label ? 'var(--accent)' : 'transparent',
        color: f === label ? '#ffffff' : 'var(--graphite)',
        pick: () => this.setState({ filter: label }),
      })),
      cases: Component.CASES.filter(c => f === 'Все' || c.cats.includes(f)),
    };
  }
}
</script>
</body>
</html>
